name: Audit GHA Workflows
on:
  pull_request:
  push:
    branches: [master, main]
permissions:
  contents: read
jobs:
  zizmor:
    name: Audit GitHub Actions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install zizmor
        run: pip install zizmor==1.23.1
      - name: Create Patchpedia read token
        if: github.repository == 'SocketDev/depscan'
        id: patchpedia-token
        uses: >-
          actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.SOCKET_PR_CLIENT_ID }}
          # The required workflow scans checkout data without executing it.
          private-key: ${{ secrets.SOCKET_PR_APP_PRIVATE_KEY }}  # zizmor: ignore[secrets-outside-env]
          owner: SocketDev
          repositories: patchpedia
          permission-contents: read
      - name: Run zizmor
        env:
          GITHUB_TOKEN: >-
            ${{ steps.patchpedia-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          if [ -d .github ]; then
            zizmor .github --gh-token "${GITHUB_TOKEN}" --min-severity medium
          fi
